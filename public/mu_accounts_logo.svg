<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Metallic Blue / Indigo Primary Gradient -->
    <linearGradient id="muGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Vibrant Cyan / Emerald Accent Gradient -->
    <linearGradient id="muGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Gold Accent for Financial Success -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Outer Decorative Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#muGrad2)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="12 8" />

  <!-- Background Financial Grid / Watermark -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="120" y1="80" x2="120" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="392" y1="80" x2="392" y2="432" />
    <line x1="80" y1="170" x2="432" y2="170" />
    <line x1="80" y1="300" x2="432" y2="300" />
  </g>

  <!-- Glowing Accent Orb behind MU Monogram -->
  <circle cx="256" cy="230" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Monogram Logo Artwork: Geometric Interlocking "M" and "U" -->
  <g filter="url(#dropShadow)">
    <!-- Letter M (Left Pillar, Peak, Valleys) -->
    <!-- Left vertical bar of M -->
    <path d="M 108 140 L 148 140 L 148 320 L 108 320 Z" fill="url(#muGrad1)" rx="6" />
    
    <!-- Left diagonal stem -->
    <path d="M 148 140 L 195 242 L 165 258 L 118 156 Z" fill="url(#muGrad1)" />

    <!-- Center vertex chevron connecting M -->
    <path d="M 185 220 L 225 305 C 228 312, 238 316, 246 312 L 286 220 L 255 204 L 236 248 L 216 204 Z" fill="url(#muGrad2)" />

    <!-- Right diagonal stem of M -->
    <path d="M 276 242 L 324 140 L 354 154 L 306 258 Z" fill="url(#muGrad1)" />

    <!-- Right vertical bar of M -->
    <path d="M 324 140 L 364 140 L 364 320 L 324 320 Z" fill="url(#muGrad1)" rx="6" />

    <!-- Letter U (Integrated gracefully intertwining with M's center and flowing below) -->
    <!-- U Outer Curve -->
    <path d="M 175 230 
             C 175 230, 175 325, 175 335 
             C 175 372, 212 400, 256 400 
             C 300 400, 337 372, 337 335 
             L 337 230 
             L 302 230 
             L 302 332 
             C 302 352, 280 368, 256 368 
             C 232 368, 210 352, 210 332 
             L 210 230 Z" 
          fill="url(#muGrad2)" />

    <!-- Financial Growth Vector Upward Arrow on right side of U -->
    <path d="M 324 195 L 344 148 L 364 195 Z" fill="url(#goldAccent)" />
    <circle cx="344" cy="136" r="6" fill="#fbbf24" filter="url(#glow)" />
  </g>

  <!-- Bottom Brand Text Badge: "MU ACCOUNTS" -->
  <g transform="translate(256, 438)" text-anchor="middle">
    <!-- Badge Background -->
    <rect x="-115" y="-18" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Text -->
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#f8fafc" letter-spacing="3.5">MU ACCOUNTS</text>
  </g>
</svg>
